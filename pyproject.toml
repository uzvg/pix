[project]
name = "pix-cli"
version = "0.1.0"
description = "Batch AVIF shrink and image-host sync CLI"
readme = "README.md"
authors = [
    { name = "uzvg", email = "uzvg@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyvips[binary]>=3.2",
]

[project.scripts]
pix = "pix.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
