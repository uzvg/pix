[project]
name = "pix-cli"
version = "0.1.4"
description = "Batch AVIF shrink and image-host sync CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "uzvg", email = "uzvg@qq.com" }
]
keywords = [
    "avif",
    "image-compression",
    "image-host",
    "rclone",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: System :: Archiving :: Mirroring",
]
requires-python = ">=3.11"
dependencies = [
    "pyvips[binary]>=3.2",
]

[project.scripts]
pix = "pix.cli:main"

[project.urls]
Homepage = "https://github.com/uzvg/pix"
Repository = "https://github.com/uzvg/pix"
Issues = "https://github.com/uzvg/pix/issues"
Changelog = "https://github.com/uzvg/pix/releases"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
